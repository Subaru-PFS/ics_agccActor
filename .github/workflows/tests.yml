name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Check out pfs_instdata
        uses: actions/checkout@v4
        with:
          repository: Subaru-PFS/pfs_instdata
          path: pfs_instdata

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check python/

      - name: Run tests with coverage
        env:
          PFS_INSTDATA_DIR: ${{ github.workspace }}/pfs_instdata
        run: |
          uv run pytest tests/ -v \
            --cov=agccActor \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Write coverage summary
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const coverage = execSync('uv run coverage report --format=markdown').toString();
            const body = [
              '<!-- coverage-comment -->',
              '## Test Coverage',
              '',
              coverage,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('<!-- coverage-comment -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  build-extension:
    name: Build FLI Cython extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev

      - name: Build libfli C library
        run: make -C c/libfli-1.999.1-180223/ libfli.a

      - name: Install Python build dependencies
        run: pip install "setuptools>=77.0.3" "lsst-versions" "Cython" "numpy" "wheel" "astropy" pytest

      - name: Build fli_camera Cython extension
        run: pip install -e . --no-build-isolation --no-deps

      - name: Verify extension imports
        run: python -c "from agccActor.fli import fli_camera; print('fli_camera loaded OK'); print('Library version:', fli_camera.getLibVersion())"

      - name: Run fli_build tests
        run: pytest tests/test_fli_build.py -v
