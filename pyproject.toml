[build-system]
requires = [
    "setuptools >= 77.0.3",
    "lsst-versions",
    "Cython",
    "numpy",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ics-agcc-actor"
description = "ICS actor for the Auto Guider Camera Control"
authors = [
    { name = "Subaru PFS ICS Team" }
]
readme = "README.md"
license = { text = "PFS Collaboration" }
requires-python = ">=3.12"
keywords = ["astronomy", "spectrograph", "subaru", "pfs", "autoguider"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    # PFS actor/runtime stack
    "pfs-tron-actorcore @ git+https://github.com/Subaru-PFS/tron_actorcore.git",
    "pfs-utils @ git+https://github.com/Subaru-PFS/pfs_utils.git",
    "PyYAML",
    "astropy",
    "numpy",
    "pandas",
    "scipy",
    "sep",
    "click",
]
dynamic = ["version"]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
    "mypy",
]

[project.urls]
"Homepage" = "https://github.com/Subaru-PFS/ics_agActor"
"Bug Tracker" = "https://github.com/Subaru-PFS/ics_agActor/issues"
"Changelog" = "https://github.com/Subaru-PFS/ics_agActor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["python/"]
include = ["agccActor", "agccActor.*"]

[[tool.setuptools.ext-modules]]
name = "agccActor.fli.fli_camera"
sources = ["python/agccActor/fli/fli_camera.pyx"]
include-dirs = [
    "c/libfli-1.999.1-180223",
    "python/agccActor/fli",
]
library-dirs = ["c/libfli-1.999.1-180223"]
libraries = ["fli", "usb-1.0"]
optional = true

[tool.setuptools.data-files]
"ups" = ["ups/ics_agccActor.table"]

[tool.lsst_versions]
write_to = "python/agccActor/version.py"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib --cov=agccActor --cov-report=term-missing --nbval"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110

# Ruff configuration to ignore naming capitalization/camelCase rules for functions, methods, and variables
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["N802", "N803", "N806", "N815", "N816", "EM101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"python/agccActor/camera.py" = ["F821"]
"python/agccActor/sequence.py" = ["F821"]

[tool.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
files = ["python/agccActor"]
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
strict_optional = false

[tool.hatch.metadata]
allow-direct-references = true
